<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>날씨 앱</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="bg-canvas"></canvas>

  <main class="card">
    <h1>날씨 조회</h1>

    <form id="search-form">
      <div class="input-wrapper">
        <input type="text" id="city-input" placeholder="도시 이름 (예: Seoul, 서울)" required autocomplete="off" />
        <button type="button" id="city-dropdown-toggle" class="city-dropdown-toggle" aria-label="도시 목록 더보기">▼</button>
        <div id="city-dropdown-list" class="city-dropdown-list hidden"></div>
      </div>
      <button type="submit">검색</button>
    </form>

    <button id="locate-btn" type="button" class="locate-btn">📍 내 위치 날씨</button>

    <section id="result" class="result hidden">
      <img id="weather-icon" class="icon" alt="" />
      <div class="city-name-row">
        <h2 id="city-name"></h2>
        <button id="candidates-toggle" type="button" class="candidates-toggle hidden" aria-label="다른 지역 더보기">▼</button>
      </div>
      <p id="description"></p>
      <p id="temperature"></p>
      <p id="humidity"></p>
      <p id="wind"></p>
      <div id="city-candidates" class="city-candidates hidden"></div>
    </section>

    <div id="hourly" class="hourly hidden"></div>

    <div id="forecast" class="forecast hidden"></div>

    <p id="error" class="error hidden"></p>
  </main>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="weather-bg.js"></script>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
